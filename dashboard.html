<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service Metrics</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #121212;
  --surface: #181818;
  --surface2: #282828;
  --surface3: #333;
  --accent: #4aa3df;
  --ok: #1db954;
  --warn: #e8b339;
  --err: #e5484d;
  --text: #fff;
  --text2: #b3b3b3;
  --text3: #727272;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
a { color: var(--accent); }

header { background: var(--surface); padding: 20px 32px; border-bottom: 1px solid var(--surface2); display: flex; flex-wrap: wrap; gap: 16px; align-items: baseline; justify-content: space-between; }
header h1 { font-size: 22px; color: var(--accent); }
header .sub { color: var(--text2); font-size: 13px; margin-top: 4px; }
header .live { font-size: 12px; color: var(--text3); display: flex; align-items: center; gap: 7px; }
header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 rgba(29,185,84,.6); animation: ping 2s infinite; }
header .dot.stale { background: var(--err); animation: none; }
@keyframes ping { 70% { box-shadow: 0 0 0 7px rgba(29,185,84,0); } 100% { box-shadow: 0 0 0 0 rgba(29,185,84,0); } }

nav { background: var(--surface); border-bottom: 1px solid var(--surface2); padding: 0 32px; display: flex; overflow-x: auto; }
nav button { background: none; border: none; color: var(--text2); padding: 13px 20px; font-size: 14px; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
nav button:hover { color: var(--text); }
nav button.active { color: var(--text); border-bottom-color: var(--accent); }

main { padding: 24px 32px; max-width: 1500px; margin: 0 auto; }
.tab { display: none; }
.tab.active { display: block; }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; margin-bottom: 24px; }
.card { background: var(--surface); border-radius: 8px; padding: 18px 20px; }
.card .label { color: var(--text2); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; }
.card .value { font-size: 26px; font-weight: 700; color: var(--accent); margin-top: 6px; word-break: break-word; }
.card .value.small { font-size: 18px; }
.card .sub { color: var(--text3); font-size: 12px; margin-top: 3px; }
.card.bad .value { color: var(--err); }

.section-title { color: var(--text2); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; margin: 0 0 12px; }

table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 8px; overflow: hidden; }
.table-wrap { overflow-x: auto; border-radius: 8px; }
th { background: var(--surface2); color: var(--text2); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; padding: 11px 14px; text-align: left; white-space: nowrap; cursor: pointer; user-select: none; }
th:hover { color: var(--text); }
td { padding: 9px 14px; border-bottom: 1px solid var(--surface2); font-size: 13px; white-space: nowrap; }
tr:hover td { background: var(--surface2); }
td.wrap { white-space: normal; min-width: 240px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }

.pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
.pill.ok { background: rgba(29,185,84,.16); color: var(--ok); }
.pill.active { background: rgba(74,163,223,.16); color: var(--accent); }
.pill.error, .pill.interrupted { background: rgba(229,72,77,.16); color: var(--err); }
.pill.rejected { background: rgba(232,179,57,.16); color: var(--warn); }
.pill.src { background: var(--surface3); color: var(--text2); text-transform: none; font-weight: 500; }

.filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; align-items: center; }
select, input { background: var(--surface2); color: var(--text); border: 1px solid var(--surface3); border-radius: 4px; padding: 7px 11px; font-size: 13px; }
select:focus, input:focus { outline: none; border-color: var(--accent); }
button.ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--surface3); border-radius: 4px; padding: 7px 13px; font-size: 13px; cursor: pointer; }
button.ghost:hover { border-color: var(--accent); }
button.ghost:disabled { opacity: .4; cursor: default; }

.chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 950px) { .chart-row { grid-template-columns: 1fr; } }
.chart-box { background: var(--surface); border-radius: 8px; padding: 20px; }
.chart-box h3 { color: var(--text2); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 14px; }
canvas { max-height: 300px; }

.pagination { display: flex; gap: 8px; margin-top: 14px; align-items: center; justify-content: center; color: var(--text2); font-size: 13px; }
.empty { text-align: center; padding: 36px; color: var(--text3); }
.err-text { color: var(--err); font-size: 12px; }
.log { background: var(--surface); border-radius: 8px; padding: 6px 0; max-height: 620px; overflow-y: auto; }
.log .line { display: grid; grid-template-columns: 92px 78px 1fr; gap: 12px; padding: 5px 16px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,.04); }
.log .line:hover { background: var(--surface2); }
.log .t { color: var(--text3); }
.log .ev { color: var(--accent); overflow: hidden; text-overflow: ellipsis; }
.log .line.error .ev { color: var(--err); }
.log .line.warn .ev { color: var(--warn); }
.log .msg { color: var(--text2); overflow-wrap: anywhere; }
</style>
</head>
<body>

<header>
  <div>
    <h1 id="title">Metrics</h1>
    <div class="sub" id="subtitle">connecting…</div>
  </div>
  <div class="live"><span class="dot" id="dot"></span><span id="live-text">live</span></div>
</header>

<nav id="tabs">
  <button class="active" data-tab="overview">Overview</button>
  <button data-tab="actors">Who's connecting</button>
  <button data-tab="activity">Activity</button>
  <button data-tab="events">Event log</button>
</nav>

<main>
  <div class="tab active" id="tab-overview">
    <div class="cards" id="status-cards"></div>
    <div class="chart-row">
      <div class="chart-box"><h3>Sessions over time</h3><canvas id="chart-sessions"></canvas></div>
      <div class="chart-box"><h3>Top callers</h3><canvas id="chart-actors"></canvas></div>
    </div>
  </div>

  <div class="tab" id="tab-actors">
    <div class="filters">
      <select id="actor-window">
        <option value="">All time</option>
        <option value="1">Last 24 hours</option>
        <option value="7">Last 7 days</option>
        <option value="30">Last 30 days</option>
      </select>
    </div>
    <div class="table-wrap"><table id="actors-table"></table></div>
  </div>

  <div class="tab" id="tab-activity">
    <div class="filters">
      <select id="f-kind"><option value="">All kinds</option></select>
      <select id="f-status">
        <option value="">Any outcome</option>
        <option value="ok">ok</option>
        <option value="error">error</option>
        <option value="rejected">rejected</option>
        <option value="interrupted">interrupted</option>
        <option value="active">active</option>
      </select>
      <select id="f-actor"><option value="">All callers</option></select>
      <select id="f-hours">
        <option value="">All time</option>
        <option value="1">Last hour</option>
        <option value="24">Last 24 hours</option>
        <option value="168">Last 7 days</option>
      </select>
      <button class="ghost" id="f-reset">Reset</button>
    </div>
    <div class="table-wrap"><table id="sessions-table"></table></div>
    <div class="pagination">
      <button class="ghost" id="prev">Previous</button>
      <span id="page-info"></span>
      <button class="ghost" id="next">Next</button>
    </div>
  </div>

  <div class="tab" id="tab-events">
    <div class="filters">
      <select id="e-level">
        <option value="">All levels</option>
        <option value="info">info</option>
        <option value="warn">warn</option>
        <option value="error">error</option>
      </select>
      <label style="color:var(--text2);font-size:13px;display:flex;align-items:center;gap:6px;">
        <input type="checkbox" id="e-follow" checked style="width:14px;height:14px;accent-color:var(--accent);"> Follow
      </label>
    </div>
    <div class="log" id="event-log"></div>
  </div>
</main>

<script>
const REFRESH_MS = 3000;
const state = {
  schema: null, status: null, actors: [], sessions: {total: 0, rows: []},
  events: [], series: null, tab: 'overview', page: 0, pageSize: 50,
  sort: {key: 'last_seen', dir: -1}, charts: {}, failures: 0,
};

// ------------------------------------------------------------------ helpers

const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => (
  {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));

const fmt = {
  text: (v) => v === null || v === undefined || v === '' ? '—' : esc(v),
  number: (v) => v === null || v === undefined ? '—' : Number(v).toLocaleString(undefined, {maximumFractionDigits: 2}),
  bytes: (v) => {
    if (v === null || v === undefined) return '—';
    let n = Number(v); const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return `${n.toFixed(i === 0 ? 0 : 1)} ${u[i]}`;
  },
  seconds: (v) => {
    if (v === null || v === undefined) return '—';
    const n = Number(v);
    if (n < 1) return `${(n * 1000).toFixed(0)} ms`;
    if (n < 60) return `${n.toFixed(2)} s`;
    return fmt.duration(n);
  },
  duration: (v) => {
    if (v === null || v === undefined) return '—';
    let n = Math.round(Number(v));
    const d = Math.floor(n / 86400); n %= 86400;
    const h = Math.floor(n / 3600); n %= 3600;
    const m = Math.floor(n / 60); const s = n % 60;
    if (d) return `${d}d ${h}h`;
    if (h) return `${h}h ${m}m`;
    if (m) return `${m}m ${s}s`;
    return `${s}s`;
  },
  time: (v) => v ? new Date(v * 1000).toLocaleString(undefined,
    {month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit'}) : '—',
  clock: (v) => v ? new Date(v * 1000).toLocaleTimeString(undefined, {hour12: false}) : '',
  ago: (v) => {
    if (!v) return '—';
    const s = Date.now() / 1000 - v;
    if (s < 60) return 'just now';
    if (s < 3600) return `${Math.floor(s / 60)}m ago`;
    if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
    return `${Math.floor(s / 86400)}d ago`;
  },
};
const apply = (kind, v) => (fmt[kind] || fmt.text)(v);

async function api(path) {
  const r = await fetch(path, {headers: {'Accept': 'application/json'}});
  if (!r.ok) throw new Error(`${path} → ${r.status}`);
  return r.json();
}

// ------------------------------------------------------------------ overview

function renderStatus() {
  const s = state.status, sc = state.schema;
  if (!s) return;
  $('title').textContent = sc.title || s.service;
  $('subtitle').textContent =
    `${s.host} · up ${fmt.duration(s.uptime_s)}${s.version ? ' · ' + s.version : ''} · ${fmt.bytes(s.db_bytes)} of history`;

  const cards = [
    {label: 'Sessions (all time)', value: fmt.number(s.sessions_total)},
    {label: 'Last 24 hours', value: fmt.number(s.sessions_24h)},
    {label: 'Distinct callers', value: fmt.number(s.actors)},
    {label: 'In flight', value: fmt.number(s.sessions_active)},
    {label: 'Failed', value: fmt.number(s.sessions_failed), bad: s.sessions_failed > 0},
  ];
  // Totals the service declared it cares about, summed across every caller.
  for (const t of (sc.totals || [])) {
    const sum = state.actors.reduce((a, r) => a + Number(r[t.field] || 0), 0);
    cards.push({label: t.label, value: apply(t.format || 'number', sum)});
  }
  // Whatever the service is doing right now.
  for (const g of (sc.status || [])) {
    const v = s.gauges?.[g.gauge];
    cards.push({label: g.label, value: apply(g.format || 'text', v), small: (g.format || 'text') === 'text'});
  }
  for (const [k, v] of Object.entries(s.counters || {})) {
    cards.push({label: k.replace(/_/g, ' '), value: fmt.number(v)});
  }

  $('status-cards').innerHTML = cards.map((c) => `
    <div class="card${c.bad ? ' bad' : ''}">
      <div class="label">${esc(c.label)}</div>
      <div class="value${c.small ? ' small' : ''}">${c.value}</div>
    </div>`).join('');
}

function renderCharts() {
  if (!state.series) return;
  const rows = state.series.rows || [];
  const buckets = [...new Set(rows.map((r) => r.bucket))].sort((a, b) => a - b);
  const kinds = [...new Set(rows.map((r) => r.kind))];
  const palette = ['#4aa3df', '#1db954', '#e8b339', '#b07de0', '#e5484d', '#54c7c0'];
  const byDay = state.series.bucket === 'day';

  draw('chart-sessions', 'bar', {
    labels: buckets.map((b) => new Date(b * 1000).toLocaleString(undefined,
      byDay ? {month: 'short', day: 'numeric'} : {month: 'short', day: 'numeric', hour: '2-digit'})),
    datasets: kinds.map((k, i) => ({
      label: k,
      data: buckets.map((b) => rows.find((r) => r.bucket === b && r.kind === k)?.n || 0),
      backgroundColor: palette[i % palette.length],
    })),
  }, {scales: {x: {stacked: true}, y: {stacked: true, beginAtZero: true}}});

  const top = [...state.actors].sort((a, b) => b.sessions - a.sessions).slice(0, 8);
  draw('chart-actors', 'bar', {
    labels: top.map((a) => a.actor),
    datasets: [{
      label: 'sessions',
      data: top.map((a) => a.sessions),
      backgroundColor: top.map((_, i) => palette[i % palette.length]),
    }],
  }, {indexAxis: 'y', plugins: {legend: {display: false}}});
}

function draw(id, type, data, extra) {
  const base = {
    responsive: true, maintainAspectRatio: false,
    plugins: {legend: {labels: {color: '#b3b3b3', boxWidth: 12}}},
    scales: {
      x: {ticks: {color: '#727272'}, grid: {color: 'rgba(255,255,255,.05)'}},
      y: {ticks: {color: '#727272'}, grid: {color: 'rgba(255,255,255,.05)'}, beginAtZero: true},
    },
  };
  const opts = {...base, ...extra, scales: {...base.scales, ...(extra?.scales || {})},
                plugins: {...base.plugins, ...(extra?.plugins || {})}};
  if (state.charts[id]) {
    state.charts[id].data = data;
    state.charts[id].options = opts;
    state.charts[id].update('none');
  } else {
    state.charts[id] = new Chart($(id), {type, data, options: opts});
  }
}

// -------------------------------------------------------------------- actors

function renderActors() {
  const cols = [
    {key: 'actor', label: 'Caller', cell: (r) =>
      `<strong>${esc(r.actor)}</strong> <span class="pill src">${esc(r.source || '?')}</span>`},
    {key: 'ip', label: 'Address', cell: (r) =>
      `<span class="mono">${esc(r.ip || '—')}</span>${r.host ? `<br><span class="mono" style="color:var(--text3)">${esc(r.host)}</span>` : ''}`},
    {key: 'sessions', label: 'Sessions', cell: (r) =>
      `${fmt.number(r.sessions)}<br><span style="color:var(--text3);font-size:11px">${
        Object.entries(r.kinds || {}).map(([k, n]) => `${esc(k)} ${n}`).join(' · ') || ''}</span>`},
    {key: 'errors', label: 'Errors', cell: (r) =>
      r.errors ? `<span class="err-text">${fmt.number(r.errors)}</span>` : '0'},
    {key: 'duration_s', label: 'Time', cell: (r) => fmt.duration(r.duration_s)},
  ];
  for (const t of (state.schema.totals || [])) {
    cols.push({key: t.field, label: t.label, cell: (r) => apply(t.format || 'number', r[t.field])});
  }
  cols.push(
    {key: 'first_seen', label: 'First seen', cell: (r) => fmt.time(r.first_seen)},
    {key: 'last_seen', label: 'Last seen', cell: (r) =>
      `${fmt.ago(r.last_seen)}<br><span style="color:var(--text3);font-size:11px">${fmt.time(r.last_seen)}</span>`},
    {key: '_err', label: 'Last error', cell: (r) =>
      r.last_error ? `<span class="err-text">${esc(r.last_error.error)}</span>` : '—', wrap: true},
  );
  renderTable('actors-table', cols, sorted(state.actors),
    'Nothing has connected yet.');
}

function sorted(rows) {
  const {key, dir} = state.sort;
  if (!key) return rows;
  return [...rows].sort((a, b) => {
    const x = a[key], y = b[key];
    if (x === y) return 0;
    if (x === null || x === undefined) return 1;
    if (y === null || y === undefined) return -1;
    return (x > y ? 1 : -1) * dir;
  });
}

// ------------------------------------------------------------------ activity

function renderSessions() {
  const kindCols = {};
  for (const [k, def] of Object.entries(state.schema.kinds || {})) kindCols[k] = def.columns || [];
  // The union of every kind's declared columns, so mixed listings still line up.
  const extra = [];
  const seen = new Set();
  for (const cols of Object.values(kindCols)) {
    for (const c of cols) {
      if (!seen.has(c.field)) { seen.add(c.field); extra.push(c); }
    }
  }

  const cols = [
    {key: 'started_at', label: 'When', cell: (r) =>
      `${fmt.time(r.started_at)}<br><span style="color:var(--text3);font-size:11px">${fmt.ago(r.started_at)}</span>`},
    {key: 'actor', label: 'Caller', cell: (r) => esc(r.actor || r.actor_ip || '—')},
    {key: 'kind', label: 'Kind', cell: (r) => {
      const label = state.schema.kinds?.[r.kind]?.label || r.kind;
      return esc(label);
    }},
    {key: 'status', label: 'Outcome', cell: (r) =>
      `<span class="pill ${esc(r.status)}">${esc(r.status)}</span>`},
    {key: 'duration_s', label: 'Took', cell: (r) => fmt.seconds(r.duration_s)},
    ...extra.map((c) => ({
      key: c.field, label: c.label,
      cell: (r) => apply(c.format || 'text', r.fields?.[c.field]),
    })),
    {key: 'error', label: 'Error', wrap: true,
     cell: (r) => r.error ? `<span class="err-text">${esc(r.error)}</span>` : '—'},
  ];
  renderTable('sessions-table', cols, state.sessions.rows, 'No sessions match these filters.');

  const from = state.sessions.total === 0 ? 0 : state.page * state.pageSize + 1;
  const to = Math.min((state.page + 1) * state.pageSize, state.sessions.total);
  $('page-info').textContent = `${from}–${to} of ${state.sessions.total.toLocaleString()}`;
  $('prev').disabled = state.page === 0;
  $('next').disabled = to >= state.sessions.total;
}

function renderTable(id, cols, rows, emptyText) {
  const el = $(id);
  if (!rows.length) {
    el.innerHTML = `<tr><td class="empty">${esc(emptyText)}</td></tr>`;
    return;
  }
  const head = cols.map((c) => {
    const arrow = state.sort.key === c.key ? (state.sort.dir === 1 ? ' ↑' : ' ↓') : '';
    return `<th data-key="${esc(c.key)}">${esc(c.label)}${arrow}</th>`;
  }).join('');
  const body = rows.map((r) =>
    `<tr>${cols.map((c) => `<td${c.wrap ? ' class="wrap"' : ''}>${c.cell(r)}</td>`).join('')}</tr>`).join('');
  el.innerHTML = `<thead><tr>${head}</tr></thead><tbody>${body}</tbody>`;
  el.querySelectorAll('th').forEach((th) => th.addEventListener('click', () => {
    const key = th.dataset.key;
    state.sort = {key, dir: state.sort.key === key ? -state.sort.dir : -1};
    render();
  }));
}

// -------------------------------------------------------------------- events

function renderEvents() {
  const log = $('event-log');
  if (!state.events.length) {
    log.innerHTML = '<div class="empty">No events yet.</div>';
    return;
  }
  const follow = $('e-follow').checked;
  const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 40;
  log.innerHTML = state.events.map((e) => `
    <div class="line ${esc(e.level)}">
      <span class="t">${fmt.clock(e.ts)}</span>
      <span class="ev">${esc(e.event)}</span>
      <span class="msg">${esc(e.message || '')}${
        Object.keys(e.fields || {}).length
          ? ` <span style="color:var(--text3)">${esc(JSON.stringify(e.fields))}</span>` : ''}</span>
    </div>`).join('');
  if (follow && atBottom) log.scrollTop = log.scrollHeight;
}

// --------------------------------------------------------------------- load

async function loadAll() {
  const days = $('actor-window').value;
  const [status, actors, series] = await Promise.all([
    api('/api/metrics/status'),
    api('/api/metrics/actors' + (days ? `?days=${days}` : '')),
    api(`/api/metrics/series?bucket=${state.status && state.status.sessions_total > 400 ? 'day' : 'hour'}&days=7`),
  ]);
  state.status = status;
  state.actors = actors;
  state.series = series;
  await loadSessions();
  await loadEvents();
  refreshFilterOptions();
}

async function loadSessions() {
  const q = new URLSearchParams({limit: state.pageSize, offset: state.page * state.pageSize});
  for (const [k, id] of [['kind', 'f-kind'], ['status', 'f-status'], ['actor', 'f-actor'], ['hours', 'f-hours']]) {
    const v = $(id).value;
    if (v) q.set(k, v);
  }
  state.sessions = await api(`/api/metrics/sessions?${q}`);
}

async function loadEvents() {
  const level = $('e-level').value;
  state.events = (await api(`/api/metrics/events?limit=300${level ? `&level=${level}` : ''}`)).reverse();
}

function refreshFilterOptions() {
  fillSelect('f-kind', Object.keys(state.schema.kinds || {}).length
    ? Object.entries(state.schema.kinds).map(([k, d]) => [k, d.label || k])
    : [...new Set(state.sessions.rows.map((r) => r.kind))].map((k) => [k, k]));
  fillSelect('f-actor', state.actors.map((a) => [a.actor, a.actor]));
}

function fillSelect(id, pairs) {
  const el = $(id);
  const keep = el.value;
  const first = el.options[0];
  el.innerHTML = '';
  el.appendChild(first);
  for (const [v, label] of pairs) {
    const o = document.createElement('option');
    o.value = v; o.textContent = label;
    el.appendChild(o);
  }
  el.value = keep;
}

function render() {
  renderStatus();
  if (state.tab === 'overview') renderCharts();
  if (state.tab === 'actors') renderActors();
  if (state.tab === 'activity') renderSessions();
  if (state.tab === 'events') renderEvents();
}

async function tick() {
  try {
    await loadAll();
    state.failures = 0;
    $('dot').classList.remove('stale');
    $('live-text').textContent = `updated ${new Date().toLocaleTimeString(undefined, {hour12: false})}`;
    render();
  } catch (err) {
    state.failures++;
    $('dot').classList.add('stale');
    $('live-text').textContent = `unreachable (${state.failures})`;
    console.error(err);
  }
}

// --------------------------------------------------------------------- init

document.querySelectorAll('#tabs button').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('#tabs button').forEach((x) => x.classList.remove('active'));
  document.querySelectorAll('.tab').forEach((x) => x.classList.remove('active'));
  b.classList.add('active');
  $(`tab-${b.dataset.tab}`).classList.add('active');
  state.tab = b.dataset.tab;
  state.sort = state.tab === 'actors' ? {key: 'last_seen', dir: -1} : {key: 'started_at', dir: -1};
  render();
}));

for (const id of ['f-kind', 'f-status', 'f-actor', 'f-hours']) {
  $(id).addEventListener('change', async () => { state.page = 0; await loadSessions(); render(); });
}
$('f-reset').addEventListener('click', async () => {
  for (const id of ['f-kind', 'f-status', 'f-actor', 'f-hours']) $(id).value = '';
  state.page = 0; await loadSessions(); render();
});
$('prev').addEventListener('click', async () => { state.page = Math.max(0, state.page - 1); await loadSessions(); render(); });
$('next').addEventListener('click', async () => { state.page++; await loadSessions(); render(); });
$('actor-window').addEventListener('change', tick);
$('e-level').addEventListener('change', async () => { await loadEvents(); render(); });

(async () => {
  try {
    state.schema = await api('/api/metrics/schema');
    document.title = `${state.schema.title || state.schema.service} — metrics`;
  } catch (err) {
    $('subtitle').textContent = 'could not reach /api/metrics/schema';
    console.error(err);
    return;
  }
  await tick();
  setInterval(tick, REFRESH_MS);
})();
</script>
</body>
</html>
